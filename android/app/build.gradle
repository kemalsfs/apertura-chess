apply plugin: 'com.android.application'

// Supply these through ~/.gradle/gradle.properties or environment variables.
// Keep signing credentials out of tracked project files.
def releaseSigningValue = { propertyName, environmentName ->
    providers.gradleProperty(propertyName)
        .orElse(providers.environmentVariable(environmentName))
        .orNull
}
def releaseKeystorePath = releaseSigningValue('aperturaReleaseKeystore', 'APERTURA_RELEASE_KEYSTORE')
def releaseStorePassword = releaseSigningValue('aperturaReleaseStorePassword', 'APERTURA_RELEASE_STORE_PASSWORD')
def releaseKeyAlias = releaseSigningValue('aperturaReleaseKeyAlias', 'APERTURA_RELEASE_KEY_ALIAS')
def releaseKeyPassword = releaseSigningValue('aperturaReleaseKeyPassword', 'APERTURA_RELEASE_KEY_PASSWORD')
def releaseSigningConfigured = [releaseKeystorePath, releaseStorePassword, releaseKeyAlias, releaseKeyPassword]
    .every { it != null && !it.isBlank() }

android {
    namespace = "com.aperturachess.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.aperturachess.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 2
        versionName "2.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (releaseSigningConfigured) {
            release {
                storeFile file(releaseKeystorePath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        release {
            if (releaseSigningConfigured) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

gradle.taskGraph.whenReady { graph ->
    def releasePackagingRequested = graph.allTasks.any { task ->
        task.project == project && task.name in ['assembleRelease', 'bundleRelease', 'packageRelease', 'signReleaseBundle']
    }
    if (releasePackagingRequested && !releaseSigningConfigured) {
        throw new GradleException('Release signing requires aperturaReleaseKeystore, aperturaReleaseStorePassword, aperturaReleaseKeyAlias, and aperturaReleaseKeyPassword in user Gradle properties or their APERTURA_RELEASE_* environment equivalents.')
    }
    if (releasePackagingRequested && !file(releaseKeystorePath).isFile()) {
        throw new GradleException('Release signing keystore file was not found at the configured path.')
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
